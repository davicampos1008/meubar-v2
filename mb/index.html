<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#120d0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meu Bar">
  <title>Meu Bar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Versão do app (aparece em Mais). Mudar este número força uma limpeza única de caches antigos.
    window.APP_VERSION = "2026-11-20.1";
    (function () {
      try {
        if (localStorage.getItem("mb_heal") === window.APP_VERSION) return;
        localStorage.setItem("mb_heal", window.APP_VERSION);
        var jobs = [];
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
        Promise.all(jobs).then(function () { location.reload(); });
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"><div class="gate"><p class="mu">Carregando Meu Bar…</p></div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="config.js"></script>
  <script src="brand.js"></script>
  <script src="catalog.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      var hadController = !!navigator.serviceWorker.controller, refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (hadController && !refreshing) { refreshing = true; location.reload(); }
      });
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then(function (reg) {
          reg.update();
          document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") reg.update(); });
        }).catch(console.warn);
      });
    }
  </script>
</body>
</html>
